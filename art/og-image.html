<!doctype html>
<!--
  Source of art/og-image.png (social card, 2:1), in the Codesmiths style of codesmiths.nl and
  laravel-ocr-space: JetBrains Mono, a light grid, Monokai orange for the package name, the logos
  of the service and Laravel top right.

  Logos: art/logos/cirrux-icon.png (the Cirrux favicon, cirrux.co) with the "cirrux" wordmark in
  Geist as on cirrux.co (SemiBold asked as extrabold, so the browser emboldens it the same way), and art/logos/laravel-mark.svg (github.com/laravel/art).
  The package is unofficial; the card says so.

  Regenerate (renders at 2x, 2560x1280; needs JetBrains Mono installed and network for Geist):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --force-device-scale-factor=2 --window-size=1280,640 --screenshot=art/og-image.png art/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laravel Cirrux Calendar</title>
<style>
  @font-face {
    font-family: "Geist";
    src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-SemiBold.woff2") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color: #272822;
    background-color: #fbfbfc;
    background-image:
      linear-gradient(to right, #eef0f3 1px, transparent 1px),
      linear-gradient(to bottom, #eef0f3 1px, transparent 1px);
    background-size: 53.33px 53.33px;
    position: relative;
  }
  .logos {
    position: absolute; top: 76px; right: 92px;
    display: flex; align-items: center; gap: 72px;
  }
  .cirrux { display: flex; align-items: center; gap: 14px; }
  .cirrux img { width: 58px; height: 58px; }
  .cirrux span {
    font-family: "Geist", sans-serif; font-weight: 800;
    font-size: 54px; letter-spacing: -0.05em; color: #000;
    line-height: 1; padding-bottom: 6px;
  }
  .laravel { height: 104px; width: auto; }
  .text { position: absolute; left: 76px; bottom: 120px; }
  .brand { font-size: 46px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #2b2b2b; }
  .package { font-size: 50px; font-weight: 400; color: #e8823a; letter-spacing: 0.06em; margin-top: 2px; }
  .tagline { font-size: 22px; font-style: italic; font-weight: 300; color: #2b2b2b; margin-top: 38px; letter-spacing: 0.05em; }
  .note { position: absolute; right: 92px; bottom: 56px; font-size: 14px; color: #9ca3af; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="logos">
    <div class="cirrux"><img src="logos/cirrux-icon.png" alt=""><span>cirrux</span></div>
    <img class="laravel" src="logos/laravel-mark.svg" alt="Laravel">
  </div>

  <div class="text">
    <div class="brand">Codesmiths</div>
    <div class="package">laravel-cirrux-calendar</div>
    <div class="tagline">Availability and bookings in your Cirrux calendar, from Laravel</div>
  </div>

  <div class="note">unofficial · not affiliated with Cirrux</div>
</body>
</html>
