<!doctype html>
<!--
  Source of art/og-image.png (1280x640, the GitHub social preview).
  Regenerate:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1280,640 --screenshot=art/og-image.png art/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laravel Cirrux Calendar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; right: 64px; top: 72px;
    display: grid; grid-template-columns: repeat(5, 72px); gap: 10px;
  }
  .grid span {
    height: 52px; border-radius: 8px;
    background: #1e293b; border: 1px solid #334155;
  }
  .grid span.busy { background: #334155; }
  .grid span.free { background: #0d3b2e; border-color: #10b981; }
  .grid span.booked { background: #10b981; border-color: #10b981; }
  .grid .day {
    height: auto; background: none; border: none;
    font-size: 18px; color: #64748b; text-align: center; padding-bottom: 4px;
  }
  .content { position: absolute; left: 80px; top: 88px; width: 640px; }
  .tag {
    display: inline-block; font-size: 20px; letter-spacing: 0.04em;
    color: #10b981; border: 1px solid #10b981; border-radius: 999px;
    padding: 6px 16px; margin-bottom: 32px;
  }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; color: #f8fafc; letter-spacing: -0.02em; }
  p { font-size: 28px; line-height: 1.4; color: #94a3b8; margin-top: 28px; }
  code {
    position: absolute; left: 80px; bottom: 72px;
    font-family: "SF Mono", Menlo, monospace; font-size: 24px;
    color: #e2e8f0; background: #1e293b; border: 1px solid #334155;
    border-radius: 10px; padding: 16px 22px;
  }
  code .k { color: #10b981; }
  code .s { color: #fbbf24; }
  .note { position: absolute; right: 64px; bottom: 80px; font-size: 18px; color: #64748b; }
</style>
</head>
<body>
  <div class="content">
    <span class="tag">Laravel package · beta</span>
    <h1>Laravel Cirrux Calendar</h1>
    <p>Cached availability, booking and cancelling on the Cirrux calendar API.</p>
  </div>

  <div class="grid" aria-hidden="true">
    <span class="day">Mon</span><span class="day">Tue</span><span class="day">Wed</span><span class="day">Thu</span><span class="day">Fri</span>
    <span class="free"></span><span class="busy"></span><span></span><span class="busy"></span><span class="free"></span>
    <span class="booked"></span><span></span><span class="busy"></span><span></span><span class="free"></span>
    <span class="free"></span><span class="busy"></span><span></span><span></span><span class="booked"></span>
    <span class="free"></span><span></span><span></span><span class="busy"></span><span class="free"></span>
    <span class="busy"></span><span></span><span class="busy"></span><span></span><span class="free"></span>
  </div>

  <code><span class="k">Cirrux</span>::book(<span class="s">'demo'</span>, $start, $attendee)</code>
  <div class="note">Unofficial · not affiliated with Cirrux</div>
</body>
</html>
