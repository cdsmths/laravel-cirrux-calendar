name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Pint + Rector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Run lint checks
        run: composer test:lint

  types:
    name: Types (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Run PHPStan
        run: composer test:types

  type-coverage:
    name: Type coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Run type coverage
        run: composer test:type-coverage
